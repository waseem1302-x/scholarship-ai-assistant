name: scholarship-ai-assistant

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scholarship
      POSTGRES_USER: scholarship
      POSTGRES_PASSWORD: scholarship
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholarship -d scholarship"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    image: scholarship-ai-assistant:local
    build: .
    environment:
      APP_ENV: development
      APP_DATABASE_URL: postgresql+psycopg://scholarship:scholarship@db:5432/scholarship
      APP_JWT_SECRET: local-compose-secret-change-before-any-shared-deployment
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    image: scholarship-ai-assistant:local
    build: .
    environment:
      APP_ENV: development
      APP_DATABASE_URL: postgresql+psycopg://scholarship:scholarship@db:5432/scholarship
      APP_JWT_SECRET: local-compose-secret-change-before-any-shared-deployment
      APP_CORS_ORIGINS: http://localhost:3000
      # The default stack must not advertise intake without its scanner/worker. Operators enabling
      # the documents profile must also explicitly set APP_DOCUMENT_LAB_ENABLED=true.
      APP_DOCUMENT_LAB_ENABLED: ${APP_DOCUMENT_LAB_ENABLED:-false}
      APP_DOCUMENT_LAB_STORAGE_ROOT: /app/document-data
      APP_CATALOGUE_DOCUMENT_WORKER_TRANSPORT_ROOT: /var/lib/catalogue-docling-jobs
      # Manually reviewed owner domains for the private priority seed. This only
      # permits acquisition; it never verifies facts or publishes a record.
      APP_CATALOGUE_REVIEWED_OFFICIAL_DOMAINS: daad.de,stipendiumhungaricum.hu,gatescambridge.org,rhodeshouse.ox.ac.uk,ox.ac.uk,studyinchina.org.cn,gks.go.kr,studyinkorea.go.kr
    volumes:
      - document_lab_data:/app/document-data
      - catalogue_document_jobs:/var/lib/catalogue-docling-jobs
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "8000:8000"

  source-monitor:
    profiles: ["monitoring"]
    image: scholarship-ai-assistant:local
    build: .
    environment:
      APP_ENV: development
      APP_DATABASE_URL: postgresql+psycopg://scholarship:scholarship@db:5432/scholarship
      APP_JWT_SECRET: local-compose-secret-change-before-any-shared-deployment
      APP_SOURCE_MONITOR_INTERVAL_DAYS: ${APP_SOURCE_MONITOR_INTERVAL_DAYS:-7}
      APP_SOURCE_MONITOR_LIMIT: ${APP_SOURCE_MONITOR_LIMIT:-20}
      APP_SOURCE_MONITOR_POLL_SECONDS: ${APP_SOURCE_MONITOR_POLL_SECONDS:-86400}
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    command: >
      sh -c 'while true; do python -m app.cli.monitor_sources;
      sleep "$${APP_SOURCE_MONITOR_POLL_SECONDS}"; done'
    restart: unless-stopped

  reminder-worker:
    profiles: ["reminders"]
    image: scholarship-ai-assistant:local
    build: .
    environment:
      APP_ENV: development
      APP_DATABASE_URL: postgresql+psycopg://scholarship:scholarship@db:5432/scholarship
      APP_JWT_SECRET: local-compose-secret-change-before-any-shared-deployment
      APP_REMINDER_WORKER_POLL_SECONDS: ${APP_REMINDER_WORKER_POLL_SECONDS:-60}
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    command: >
      sh -c 'while true; do python -m app.cli.dispatch_reminders;
      sleep "$${APP_REMINDER_WORKER_POLL_SECONDS}"; done'
    restart: unless-stopped

  retention-worker:
    profiles: ["retention"]
    image: scholarship-ai-assistant:local
    build: .
    environment:
      APP_ENV: development
      APP_DATABASE_URL: postgresql+psycopg://scholarship:scholarship@db:5432/scholarship
      APP_JWT_SECRET: local-compose-secret-change-before-any-shared-deployment
      APP_RETENTION_WORKER_POLL_SECONDS: ${APP_RETENTION_WORKER_POLL_SECONDS:-86400}
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    command: >
      sh -c 'while true; do python -m app.cli.run_retention;
      sleep "$${APP_RETENTION_WORKER_POLL_SECONDS}"; done'
    restart: unless-stopped

  catalogue-worker:
    profiles: ["catalogue"]
    image: scholarship-ai-assistant-catalogue-worker:local
    build:
      context: .
      target: catalogue-worker
    env_file:
      - path: ./config/catalogue/worker.env.example
      - path: ./.local/env/catalogue-worker.env
        required: false
    environment:
      APP_ENV: development
      APP_DATABASE_URL: postgresql+psycopg://scholarship:scholarship@db:5432/scholarship
      APP_CATALOGUE_DOCUMENT_WORKER_TRANSPORT_ROOT: /var/lib/catalogue-docling-jobs
      APP_CATALOGUE_AI_CAPABILITY_RECEIPT_PATH: /run/catalogue/model-capability.json
    volumes:
      - catalogue_document_jobs:/var/lib/catalogue-docling-jobs
      - ./.catalogue-local:/run/catalogue:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    command: >
      sh -c 'while true; do python -m app.cli.process_catalogue_ingestion_runs --limit 1 --batch-size 1;
      sleep "$${APP_CATALOGUE_WORKER_POLL_SECONDS:-30}"; done'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=536870912,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  document-worker:
    profiles: ["documents"]
    image: scholarship-ai-assistant:local
    build: .
    environment:
      APP_ENV: development
      APP_DATABASE_URL: postgresql+psycopg://scholarship:scholarship@db:5432/scholarship
      APP_JWT_SECRET: local-compose-secret-change-before-any-shared-deployment
      APP_DOCUMENT_LAB_ENABLED: "true"
      APP_DOCUMENT_LAB_STORAGE_ROOT: /app/document-data
      APP_DOCUMENT_LAB_SCANNER_PROVIDER: clamav
      APP_DOCUMENT_LAB_SCANNER_HOST: clamav
      APP_DOCUMENT_LAB_PROVIDER: unavailable
    volumes:
      - document_lab_data:/app/document-data
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      clamav:
        condition: service_healthy
    command: >
      sh -c 'while true; do python -m app.cli.dispatch_document_jobs;
      sleep 5; done'
    restart: unless-stopped

  # Reference isolation envelope for the one-shot catalogue PDF converter.
  # The current Python supervisor does not yet invoke this image, so this
  # profile remains disabled until its transport and runtime proof are added.
  # It deliberately has no database, Redis, API, or application-secret
  # environment variables.
  document-converter:
    profiles: ["catalogue-document-conversion"]
    build:
      context: .
      dockerfile: docker/docling-worker.Dockerfile
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=536870912,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 4g
    cpus: 2.0
    volumes:
      - catalogue_document_jobs:/jobs
    command: ["--serve", "--job-root", "/jobs", "--poll-milliseconds", "100"]

  clamav:
    profiles: ["documents"]
    image: clamav/clamav:1.4
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version"]
      interval: 30s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
    # Compose manages a fresh default volume. Existing developers can opt into
    # a legacy volume with POSTGRES_DATA_VOLUME=scholarshipaiassistant_postgres_data.
    name: ${POSTGRES_DATA_VOLUME:-scholarship-ai-assistant-postgres-data}
  document_lab_data:
  catalogue_document_jobs:
    name: ${CATALOGUE_DOCUMENT_JOBS_VOLUME:-scholarship-ai-assistant-catalogue-document-jobs}
