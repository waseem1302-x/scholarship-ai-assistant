name: scholarship-ai-assistant

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scholarship
      POSTGRES_USER: scholarship
      POSTGRES_PASSWORD: scholarship
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholarship -d scholarship"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    image: scholarship-ai-assistant:local
    build: .
    environment:
      APP_ENV: development
      APP_DATABASE_URL: postgresql+psycopg://scholarship:scholarship@db:5432/scholarship
      APP_JWT_SECRET: local-compose-secret-change-before-any-shared-deployment
      APP_CORS_ORIGINS: http://localhost:3000
      APP_DOCUMENT_LAB_ENABLED: "true"
      APP_DOCUMENT_LAB_STORAGE_ROOT: /app/document-data
    volumes:
      - document_lab_data:/app/document-data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "8000:8000"

  source-monitor:
    profiles: ["monitoring"]
    image: scholarship-ai-assistant:local
    build: .
    environment:
      APP_ENV: development
      APP_DATABASE_URL: postgresql+psycopg://scholarship:scholarship@db:5432/scholarship
      APP_JWT_SECRET: local-compose-secret-change-before-any-shared-deployment
      APP_SOURCE_MONITOR_INTERVAL_DAYS: ${APP_SOURCE_MONITOR_INTERVAL_DAYS:-7}
      APP_SOURCE_MONITOR_LIMIT: ${APP_SOURCE_MONITOR_LIMIT:-20}
      APP_SOURCE_MONITOR_POLL_SECONDS: ${APP_SOURCE_MONITOR_POLL_SECONDS:-86400}
    depends_on:
      api:
        condition: service_healthy
    command: >
      sh -c 'while true; do python -m app.cli.monitor_sources;
      sleep "$${APP_SOURCE_MONITOR_POLL_SECONDS}"; done'
    restart: unless-stopped

  reminder-worker:
    profiles: ["reminders"]
    image: scholarship-ai-assistant:local
    build: .
    environment:
      APP_ENV: development
      APP_DATABASE_URL: postgresql+psycopg://scholarship:scholarship@db:5432/scholarship
      APP_JWT_SECRET: local-compose-secret-change-before-any-shared-deployment
      APP_REMINDER_WORKER_POLL_SECONDS: ${APP_REMINDER_WORKER_POLL_SECONDS:-60}
    depends_on:
      api:
        condition: service_healthy
    command: >
      sh -c 'while true; do python -m app.cli.dispatch_reminders;
      sleep "$${APP_REMINDER_WORKER_POLL_SECONDS}"; done'
    restart: unless-stopped

  document-worker:
    profiles: ["documents"]
    image: scholarship-ai-assistant:local
    build: .
    environment:
      APP_ENV: development
      APP_DATABASE_URL: postgresql+psycopg://scholarship:scholarship@db:5432/scholarship
      APP_JWT_SECRET: local-compose-secret-change-before-any-shared-deployment
      APP_DOCUMENT_LAB_ENABLED: "true"
      APP_DOCUMENT_LAB_STORAGE_ROOT: /app/document-data
      # A reviewed malware-scanner adapter must be configured before analysis.
      APP_DOCUMENT_LAB_PROVIDER: unavailable
    volumes:
      - document_lab_data:/app/document-data
    depends_on:
      api:
        condition: service_healthy
    command: >
      sh -c 'while true; do python -m app.cli.dispatch_document_jobs;
      sleep 5; done'
    restart: unless-stopped

volumes:
  postgres_data:
    # Preserve the existing development database when moving from Compose's
    # former default project name to the explicit project name above.
    external: true
    name: scholarshipaiassistant_postgres_data
  document_lab_data:
