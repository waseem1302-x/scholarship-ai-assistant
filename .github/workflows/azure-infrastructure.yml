name: Azure infrastructure validation

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'infra/azure/**'
      - '.github/workflows/azure-infrastructure.yml'
      - '.github/workflows/azure-application-deploy.yml'

permissions:
  contents: read

jobs:
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compile Azure deployment templates
        uses: azure/cli@9f7ce6f37c31b777ec6c6b6d1dfe7db79f497956 # v2
        with:
          azcliversion: 2.76.0
          inlineScript: |
            set -euo pipefail
            az bicep install --version v0.37.4
            test "$(az bicep version | sed -n 's/.*Bicep CLI version \([^ ]*\).*/\1/p')" = "0.37.4"
            for template in infra/azure/*.bicep; do
              az bicep build --file "$template"
            done
