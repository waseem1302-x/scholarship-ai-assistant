name: Temporary remediation formatter

on:
  push:
    branches:
      - audit/remediate-087-106-residuals
    paths:
      - '.github/workflows/temporary-format-residual-branch.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/remediate-087-106-residuals
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned formatter
        run: python -m pip install 'ruff==0.16.2'
      - name: Format Python baseline
        run: ruff format .
      - name: Commit deterministic formatting
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.py'
          git commit -m 'Normalize Python formatting baseline'
          git push origin HEAD:audit/remediate-087-106-residuals
