name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One current validation run per PR/ref. A newer commit makes an older run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: scholarship_test
          POSTGRES_USER: scholarship
          POSTGRES_PASSWORD: scholarship
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scholarship -d scholarship_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_DATABASE_URL: postgresql+psycopg://scholarship:scholarship@localhost:5432/scholarship_test
      TEST_POSTGRES_URL: postgresql+psycopg://scholarship:scholarship@localhost:5432/scholarship_test
      TEST_REDIS_URL: redis://localhost:6379/15
      APP_JWT_SECRET: ci-secret-that-is-at-least-32-characters-long
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker compose config -q
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: corepack enable
      - run: corepack prepare pnpm@11.16.0 --activate
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.11.33
          uv sync --frozen --extra dev
      - run: uv run alembic upgrade head
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Backend, security, integration, and concurrency tests with coverage gate
        run: uv run pytest -ra -m "not e2e" --cov=app --cov-report=term-missing --cov-fail-under=85

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: scholarship_test
          POSTGRES_USER: scholarship
          POSTGRES_PASSWORD: scholarship
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scholarship -d scholarship_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_DATABASE_URL: postgresql+psycopg://scholarship:scholarship@localhost:5432/scholarship_test
      APP_JWT_SECRET: ci-secret-that-is-at-least-32-characters-long
      E2E_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: corepack enable
      - run: corepack prepare pnpm@11.16.0 --activate
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.11.33
          uv sync --frozen --extra dev
      - name: Install Playwright browsers for this validation depth
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # PRs prove the complete browser journey on Chromium. Full cross-engine
            # compatibility remains a main/release gate, where it provides extra signal.
            uv run playwright install --with-deps chromium
          else
            uv run playwright install --with-deps chromium firefox webkit
          fi
      - run: uv run alembic upgrade head
      - run: uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/scholarship-api.log 2>&1 &
      - name: Wait for the API
        run: |
          for attempt in {1..30}; do
            curl --fail --silent --show-error http://127.0.0.1:8000/health/ready && exit 0
            sleep 1
          done
          cat /tmp/scholarship-api.log
          exit 1
      - name: Full browser journeys on Chromium
        run: uv run pytest -m "e2e and not browser_compat" --browser chromium
      - name: Critical compatibility and accessibility journey on Chromium
        if: github.event_name == 'pull_request'
        run: uv run pytest -m "e2e and browser_compat" --browser chromium
      - name: Critical compatibility and accessibility journey on all engines
        if: github.event_name != 'pull_request'
        run: uv run pytest -m "e2e and browser_compat" --browser chromium --browser firefox --browser webkit

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build release candidate image
        run: docker build --tag scholarship-ai-assistant:${{ github.sha }} .
      - name: Scan source filesystem, dependencies, secrets, and IaC misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Scan the actual release-candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: scholarship-ai-assistant:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
