name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: scholarship_test
          POSTGRES_USER: scholarship
          POSTGRES_PASSWORD: scholarship
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scholarship -d scholarship_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_DATABASE_URL: postgresql+psycopg://scholarship:scholarship@localhost:5432/scholarship_test
      APP_JWT_SECRET: ci-secret-that-is-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: corepack enable
      - run: corepack prepare pnpm@11.16.0 --activate
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      - run: python -m pip install -e ".[dev]"
      - run: python -m alembic upgrade head
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not e2e" --cov=app --cov-report=term-missing

  browser-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: scholarship_test
          POSTGRES_USER: scholarship
          POSTGRES_PASSWORD: scholarship
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scholarship -d scholarship_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_DATABASE_URL: postgresql+psycopg://scholarship:scholarship@localhost:5432/scholarship_test
      APP_JWT_SECRET: ci-secret-that-is-at-least-32-characters-long
      E2E_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: corepack enable
      - run: corepack prepare pnpm@11.16.0 --activate
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m alembic upgrade head
      - run: python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/scholarship-api.log 2>&1 &
      - name: Wait for the API
        run: |
          for attempt in {1..30}; do
            curl --fail --silent --show-error http://127.0.0.1:8000/health/ready && exit 0
            sleep 1
          done
          cat /tmp/scholarship-api.log
          exit 1
      - run: pytest -m e2e

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release candidate image
        run: docker build --tag scholarship-ai-assistant:${{ github.sha }} .
      - name: Scan filesystem, dependencies, secrets, and image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: scholarship-ai-assistant:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
