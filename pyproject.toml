[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scholarship-ai-assistant"
version = "0.1.0"
description = "Source-first global scholarship opportunity intelligence platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "azure-monitor-opentelemetry>=1.8.9,<2",
  "boto3>=1.43,<2",
  "cryptography>=50,<51",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.10,<3",
  "pypdf>=6,<7",
  "PyJWT>=2.10,<3",
  "redis>=6.4,<7",
  "sqlalchemy>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
  "webauthn>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "playwright>=1.62,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "pytest-playwright>=0.7,<1",
  # Keep formatter output reproducible across CI/local runs; upgrade deliberately.
  "ruff==0.16.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  "e2e: runs against a live browser and application URL",
  "redis: runs against a disposable Redis service supplied by TEST_REDIS_URL",
  "postgres: runs security and concurrency tests against disposable PostgreSQL",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
